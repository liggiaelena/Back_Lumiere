services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: lumiere_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env: inside the compose
      # network the database is reachable at host "db", not "localhost".
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-123456}@db:5432/lumiere_db
      JWT_SECRET: ${JWT_SECRET:-lumiere-development-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  pgdata:
